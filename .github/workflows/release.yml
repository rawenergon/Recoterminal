name: Build & Release Recoterminal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & pack
        run: |
          npm install
          npm pack
          TGZ_FILE=$(ls recoterminal-*.tgz | head -n 1)
          cp "$TGZ_FILE" recoterminal.tgz
          echo "PACKED_FILE=$TGZ_FILE" >> $GITHUB_ENV

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Recoterminal Latest Release"
          prerelease: false
          generate_release_notes: true
          files: |
            recoterminal.tgz
            ${{ env.PACKED_FILE }}
            install.ps1
            install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
